[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "punch-clock"
description = "Turn a weekly Jibble timesheet export into a compact, printable supervisor report."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
punch-clock = "punch_clock.app:main"

[tool.setuptools.dynamic]
version = { attr = "punch_clock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
